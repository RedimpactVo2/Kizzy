name: Test Build

on:
  push:
    branches: [ "master", "ripro-branding" ]
    paths-ignore:
      - 'metadata/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'metadata/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Apk
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup jdk-17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug
        run: ./gradlew assembleKizzyBridgeDebug assembleRiproDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rpc-bridge-apks
          path: app/build/outputs/apk/**/*.apk