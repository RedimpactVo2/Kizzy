name: Build Debug Apk

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup jdk-17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug
        run: ./gradlew --no-daemon assembleKizzyBridgeDebug assembleRiproDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rpc-bridge-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
